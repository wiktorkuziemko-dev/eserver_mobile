name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit tests and APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        run: |
          # Błędy jako adnotacje – widoczne w podsumowaniu uruchomienia bez pobierania logów.
          grep -vE "^> Task" build.log | grep -E "^e: |What went wrong|^> |^   > |FAILED|error:|Exception" | head -80 > errors.txt || true
          split -l 6 errors.txt part_
          for f in part_*; do
            msg=$(sed 's/%/%25/g' "$f" | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build::$msg"
          done
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: fleet-monitor-apk
          path: app/build/outputs/apk/**/*.apk
