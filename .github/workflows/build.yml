name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Klucz przesyłania Google Play
        id: keystore
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Google Play::Brak klucza przesyłania – plik AAB nie zostanie zbudowany."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Testy, APK i AAB
        run: |
          set -o pipefail
          TASKS=":shared:testAndroidHostTest :app:assembleDebug :app:assembleRelease"
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then TASKS="$TASKS :app:bundleRelease"; fi
          ./gradlew --no-daemon $TASKS 2>&1 | tee build.log
      - name: Raport błędów
        if: failure()
        run: .github/scripts/report-errors.sh build.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: fleet-monitor-apk
          path: app/build/outputs/apk/**/*.apk
      - uses: actions/upload-artifact@v4
        if: success() && steps.keystore.outputs.signed == 'true'
        with:
          name: fleet-monitor-aab-google-play
          path: app/build/outputs/bundle/release/*.aab

  ios:
    runs-on: macos-latest
    env:
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'pl.fleet.monitor' }}
      APPLE_TEAM_ID: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Wybór najnowszego Xcode
        run: .github/scripts/select-xcode.sh
      - name: Projekt Xcode (XcodeGen)
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate
      - name: Budowanie na symulator
        run: |
          set -o pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath iosApp/build CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build 2>&1 | tee build.log
      - name: Raport błędów
        if: failure()
        run: .github/scripts/report-errors.sh build.log
      - name: Zrzut ekranu z symulatora
        run: .github/scripts/simulator-screenshot.sh iosApp/build/Build/Products/Debug-iphonesimulator/iosApp.app "$IOS_BUNDLE_ID" screenshots
      - name: Publikacja zrzutów (gałąź ci-screenshots)
        run: |
          cd screenshots
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Zrzuty z ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots

  testflight:
    needs: ios
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'pl.fleet.monitor' }}
    steps:
      - name: Sprawdzenie konfiguracji App Store Connect
        id: check
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8_BASE64" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=TestFlight::Brak sekretów App Store Connect – wysyłka do TestFlight pominięta."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.enabled == 'true'
      - uses: actions/setup-java@v5
        if: steps.check.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        if: steps.check.outputs.enabled == 'true'
      - name: Archiwum i wysyłka do TestFlight
        if: steps.check.outputs.enabled == 'true'
        run: |
          set -o pipefail
          .github/scripts/select-xcode.sh
          brew install xcodegen
          (cd iosApp && xcodegen generate)
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            "${AUTH[@]}" archive 2>&1 | tee build.log
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            -exportOptionsPlist iosApp/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" 2>&1 | tee -a build.log
      - name: Raport błędów
        if: failure()
        run: .github/scripts/report-errors.sh build.log
