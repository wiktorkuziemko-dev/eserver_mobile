name: Probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          v=$(curl -s https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/maven-metadata.xml | grep -o '<version>[^<]*' | sed 's/<version>//' | grep -E '^9\.' | tr '\n' ' ')
          echo "::error title=AGP::$v"
          s=$(curl -s https://dl.google.com/dl/android/maven2/com/android/kotlin/multiplatform/library/com.android.kotlin.multiplatform.library.gradle.plugin/maven-metadata.xml | grep -o '<version>[^<]*' | sed 's/<version>//' | tail -5 | tr '\n' ' ')
          echo "::error title=KMPLIB::$s"
          a=$(curl -s https://dl.google.com/dl/android/maven2/androidx/activity/activity-compose/maven-metadata.xml | grep -o '<version>[^<]*' | sed 's/<version>//' | tail -4 | tr '\n' ' ')
          echo "::error title=ACT::$a"
          c=$(curl -s https://dl.google.com/dl/android/maven2/androidx/core/core-ktx/maven-metadata.xml | grep -o '<version>[^<]*' | sed 's/<version>//' | tail -4 | tr '\n' ' ')
          echo "::error title=CORE::$c"
          exit 1
